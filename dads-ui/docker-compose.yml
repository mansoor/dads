services:

  # ── DADS UI ───────────────────────────────────────────────────────────────────
  dads-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dads-ui
    restart: unless-stopped
    ports:
      - "${DADS_UI_PORT:-8080}:8080"
    volumes:
      # Toolkit root (read-only): scripts/, templates/, init_workspace.sh
      - ../:/toolkit:ro
      # Workspaces (read-write): run.sh is executed here
      - ../workspaces:/toolkit/workspaces
      # Docker socket: needed for shell bridge to run docker commands
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent data: SQLite DB
      - dads-ui-data:/data
    environment:
      - LISTEN_ADDR=:8080
      - TOOLKIT_ROOT=/toolkit
      - WORKSPACES_DIR=/toolkit/workspaces
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    networks:
      - traefik_net
    # Optional: expose DADS UI itself via Traefik + SSL at DADS_DOMAIN.
    # Uncomment labels block and set DADS_DOMAIN in .env to enable.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.dads-ui.rule=Host(`${DADS_DOMAIN}`)"
    #   - "traefik.http.routers.dads-ui.entrypoints=websecure"
    #   - "traefik.http.routers.dads-ui.tls=true"
    #   - "traefik.http.routers.dads-ui.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.dads-ui.loadbalancer.server.port=8080"

  # ── Traefik reverse proxy ─────────────────────────────────────────────────────
  # Routes HTTP/HTTPS traffic to workspace containers based on Docker labels.
  # Issues and renews Let's Encrypt certificates automatically.
  #
  # Requirements for SSL:
  #   • ACME_EMAIL must be set in .env
  #   • Port 80 must be publicly reachable for the HTTP-01 ACME challenge
  #   • Each workspace domain must resolve to this server in DNS
  #
  # If another proxy (Nginx, Cloudflare, HAProxy) sits in front, configure it
  # to forward ports 80 and 443 to this server. Set Cloudflare to "Full" SSL
  # mode if used, so the HTTP-01 challenge on port 80 can reach Traefik.
  traefik:
    image: traefik:v3.1
    container_name: dads-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      # ── Entrypoints ──
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # ── Docker provider ──
      # Watches all containers on traefik_net for label changes.
      - --providers.docker=true
      - --providers.docker.network=traefik_net
      - --providers.docker.exposedbydefault=false
      # ── Let's Encrypt ACME (HTTP-01 challenge) ──
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # ── Global HTTP → HTTPS redirect ──
      # Applied only to routers that opt in via their entrypoint labels.
      # Workspaces without SSL keep their HTTP router on the 'web' entrypoint.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # ── Logging ──
      - --log.level=INFO
      - --accesslog=false
      # ── Dashboard (disabled by default) ──
      # To enable: change to --api.dashboard=true and add labels to this service.
      - --api.dashboard=false
    volumes:
      # Docker socket — read-only; Traefik only watches, never modifies
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Certificate storage — mount a named volume so certs survive restarts
      - traefik-certs:/certs
    networks:
      - traefik_net

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # Shared Docker network for Traefik routing.
  # Workspace compose files reference this as: external: true
  # All workspace containers that set traefik_enabled=true join this network.
  traefik_net:
    name: traefik_net
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  dads-ui-data:
  # Let's Encrypt certificate store — back this volume up regularly
  traefik-certs:
