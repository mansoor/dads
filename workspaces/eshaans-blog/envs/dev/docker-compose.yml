version: "3.8"

networks:
  eshaans-blog_dev_net:
    driver: bridge

volumes:
  eshaans-blog_dev_mysql_data:
  eshaans-blog_dev_uploads:

services:

  # ── Backend (laravel) ────────────────────────────────────────────────────
  eshaans-blog_dev_backend:
    image: ${BACKEND_IMAGE:-registry.example.com/eshaans-blog-backend:1.0.0-build.0-dev}
    container_name: eshaans-blog_dev_backend
    env_file: .env
    volumes:
      - eshaans-blog_dev_uploads:/app/storage/uploads
    networks:
      - eshaans-blog_dev_net
    depends_on:
      - eshaans-blog_dev_mysql
    restart: unless-stopped

  # ── Nginx ────────────────────────────────────────────────────────────────────
  eshaans-blog_dev_nginx:
    image: nginx:1.25-alpine
    container_name: eshaans-blog_dev_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - eshaans-blog_dev_uploads:/var/www/uploads:ro
    depends_on:
      - eshaans-blog_dev_backend
    networks:
      - eshaans-blog_dev_net
    ports:
      - "8080:80"
    restart: unless-stopped

  # ── MySQL 8.0 ────────────────────────────────────────────────────────
  eshaans-blog_dev_mysql:
    image: mysql:8.0
    container_name: eshaans-blog_dev_mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - eshaans-blog_dev_mysql_data:/var/lib/mysql
    networks:
      - eshaans-blog_dev_net
    restart: unless-stopped

