# Generated: 2026-05-29 21:47:31 UTC
# Regenerate: ./run.sh refresh prod
# ============================================================

version: "3.8"

networks:
  myapp_prod_net:
    driver: bridge
  traefik_net:
    external: true

volumes:
  myapp_prod_pg_data:
  myapp_prod_redis_data:
  myapp_prod_uploads:

services:

  # ── Backend (laravel) ────────────────────────────────────────────────────
  myapp_prod_backend:
    image: ${BACKEND_IMAGE:-registry.example.com/myapp-backend:1.0.0-build.1-prod}
    container_name: myapp_prod_backend
    env_file: .env
    volumes:
      - myapp_prod_uploads:/app/storage/uploads
    networks:
      - myapp_prod_net
    depends_on:
      - myapp_prod_postgres
    restart: unless-stopped

  # ── Nginx ────────────────────────────────────────────────────────────────────
  myapp_prod_nginx:
    image: nginx:1.25-alpine
    container_name: myapp_prod_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - myapp_prod_uploads:/var/www/uploads:ro
    depends_on:
      - myapp_prod_backend
    networks:
      - myapp_prod_net
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.myapp_prod_nginx.rule=Host(`prod.myapp.com`)"
      - "traefik.http.routers.myapp_prod_nginx.entrypoints=web"
      - "traefik.http.services.myapp_prod_nginx.loadbalancer.server.port=80"
    restart: unless-stopped

  # ── PostgreSQL 15-alpine ──────────────────────────────────────────────
  myapp_prod_postgres:
    image: postgres:15-alpine
    container_name: myapp_prod_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - myapp_prod_pg_data:/var/lib/postgresql/data
    networks:
      - myapp_prod_net
    restart: unless-stopped

  # ── Redis 7-alpine ────────────────────────────────────────────────────────
  myapp_prod_redis:
    image: redis:7-alpine
    container_name: myapp_prod_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - myapp_prod_redis_data:/data
    networks:
      - myapp_prod_net
    restart: unless-stopped

